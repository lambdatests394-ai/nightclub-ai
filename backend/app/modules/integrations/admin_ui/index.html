<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conectar Facebook — Night Club AI</title>
<link rel="stylesheet" href="/admin/facebook/assets/style.css">
<script src="/admin/facebook/assets/admin.js" defer></script></head>
<body><main><h1>Conectar una página de Facebook</h1>
<p>Inicia sesión con tu cuenta administrativa de Night Club AI.</p>
<form id="login"><label>Correo electrónico<input id="email" type="email" autocomplete="username" required maxlength="254"></label>
<label>Contraseña<input id="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
<button id="login-button" type="submit">Iniciar sesión</button></form>
<form id="connection" hidden><label>ID de organización<input id="organization" required maxlength="36"></label>
<label>ID de la página de Facebook<input id="page" inputmode="numeric" required maxlength="128" pattern="[1-9][0-9]*"></label>
<button id="connect-button" type="submit">Conectar con Facebook</button>
<button id="logout" type="button">Cerrar acceso en esta pantalla</button></form>
<p id="status" role="status" aria-live="polite">Preparando acceso…</p>
</main></body></html>
